services:
  - type: web
    name: agentos-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: AgentOS API
      - key: APP_VERSION
        value: 0.1.0
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      # Security: production enforces REST bearer auth automatically (APP_ENV=production).
      # Provide real signing keys via Render secret environment variables.
      - key: MCP_AUTH_SECRET_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
